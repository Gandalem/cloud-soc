# Standalone exporter. Do not replace T-Pot's internal Logstash pipelines.
input {
  file {
    id => "cloud_soc_tpot_export"
    path => ["${TPOT_LOG_GLOB}"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/tpot-export.sincedb"
    codec => json
  }
}
filter {
  if "_jsonparsefailure" in [tags] { drop {} }
  if ![timestamp] or ![src_ip] { drop {} }
  if [eventid] =~ /^cowrie\./ {
    ruby {
      code => '
        chosen = {"timestamp" => event.get("timestamp"), "src_ip" => event.get("src_ip"), "eventid" => event.get("eventid")}
        event.to_hash.keys.each { |key| event.remove(key) }
        chosen.each { |key, value| event.set(key, value) }
      '
    }
  } else if [event_type] == "alert" and [alert][signature_id] and [dest_ip] {
    ruby {
      code => '
        chosen = {"timestamp" => event.get("timestamp"), "src_ip" => event.get("src_ip"), "dest_ip" => event.get("dest_ip"), "event_type" => "alert", "alert" => {"signature_id" => event.get("[alert][signature_id]")}}
        event.to_hash.keys.each { |key| event.remove(key) }
        chosen.each { |key, value| event.set(key, value) }
      '
    }
  } else { drop {} }
}
output {
  s3 {
    id => "cloud_soc_private_archive"
    region => "ap-southeast-2"
    bucket => "${TPOT_S3_BUCKET}"
    prefix => "${TPOT_S3_PREFIX}"
    codec => json_lines
    encoding => "gzip"
    rotation_strategy => "size_and_time"
    size_file => 5242880
    time_file => 1
    server_side_encryption => true
    server_side_encryption_algorithm => "AES256"
    temporary_directory => "/usr/share/logstash/data/s3-buffer"
  }
}
