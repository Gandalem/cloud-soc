<VirtualHost 127.0.0.1:18082>
    ServerName 127.0.0.1:18082
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off

    # Late processing: remove untrusted forwarding claims before the backend runs.
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset X-Real-IP
    RequestHeader unset X-Request-ID
    RequestHeader unset X-Correlation-ID
    RequestHeader set X-Request-ID "%{UNIQUE_ID}e"
    Header onsuccess unset X-Request-ID
    Header always set X-Request-ID "%{UNIQUE_ID}e"

    # Only fixed values or bounded method captures reach the log.
    SetEnvIf Request_Method ".*" SOC_MALL_METHOD=OTHER
    SetEnvIf Request_Method "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$" SOC_MALL_METHOD=$1
    SetEnvIf Request_URI ".*" SOC_MALL_PATH=/_unclassified
    SetEnvIf Request_URI "^/$" SOC_MALL_PATH=/
    SetEnvIf Request_URI "^/login$" SOC_MALL_PATH=/login
    SetEnvIf Request_URI "^/logout$" SOC_MALL_PATH=/logout
    SetEnvIf Request_URI "^/signup$" SOC_MALL_PATH=/signup
    SetEnvIf Request_URI "^/cart$" SOC_MALL_PATH=/cart
    SetEnvIf Request_URI "^/cart/add$" SOC_MALL_PATH=/cart/add
    SetEnvIf Request_URI "^/item/[0-9]+$" SOC_MALL_PATH=/item/:id
    SetEnvIf Request_URI "^/order/checkout$" SOC_MALL_PATH=/order/checkout
    SetEnvIf Request_URI "^/order/complete/[0-9]+$" SOC_MALL_PATH=/order/complete/:id
    SetEnvIf Request_URI "^/board$" SOC_MALL_PATH=/board
    SetEnvIf Request_URI "^/board/[0-9]+$" SOC_MALL_PATH=/board/:id
    SetEnvIf Request_URI "^/board/(write|edit)$" SOC_MALL_PATH=/board/mutation
    SetEnvIf Request_URI "^/board/(edit|delete)/[0-9]+$" SOC_MALL_PATH=/board/mutation/:id
    SetEnvIf Request_URI "^/admin$" SOC_MALL_PATH=/admin
    SetEnvIf Request_URI "^/admin/item/(add|edit)$" SOC_MALL_PATH=/admin/item/mutation
    SetEnvIf Request_URI "^/admin/(item|user)/(edit|delete)/[0-9]+$" SOC_MALL_PATH=/admin/resource/mutation/:id
    SetEnvIf Request_URI "^/(css|js|images)/" SOC_MALL_PATH=/static

    # Native Apache TSV, not JSON: arbitrary Apache escapes are not JSON escapes.
    # Eight columns: schema, time, connection peer, method, path template, status, us, ID.
    LogFormat "soc-mall-access-v1\t%{%Y-%m-%dT%H:%M:%S%z}t\t%{c}a\t%{SOC_MALL_METHOD}e\t%{SOC_MALL_PATH}e\t%>s\t%D\t%{UNIQUE_ID}e" soc_mall_safe
    CustomLog "${WAF_LAB_ROOT}/logs/access.tsv" soc_mall_safe

    <Location />
        Require local
    </Location>
    ProxyPass / http://127.0.0.1:18080/ connectiontimeout=3 timeout=30 retry=0
    ProxyPassReverse / http://127.0.0.1:18080/
</VirtualHost>
