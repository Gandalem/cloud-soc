<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탐지 실행·제외 이력</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="agents.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="operations.css"><script src="auth-client.js"></script>
  <script src="shell.js" defer></script></head>
<body class="agents-page"><div id="app-shell"></div><main class="main-content agents-main operations-main">
<h1>탐지 실행·제외 이력</h1><p>규칙별 평가 결과와 탐지에서 제외한 이벤트를 확인합니다. 이벤트 본문은 표시하지 않습니다.</p>
<form id="history-filter" class="panel ops-toolbar"><label>기록 종류 <select id="history-kind"><option value="runs">규칙 실행</option><option value="exclusions">제외 이벤트</option></select></label>
<label>규칙 ID <input id="history-rule" maxlength="64" placeholder="전체 규칙"></label><button type="submit">최근 하루 조회</button></form>
<p id="history-state" role="status" aria-live="polite">조회 준비 중</p><div id="history-rows"></div><button id="history-next" type="button" hidden>다음 페이지</button>
</main><script src="detection-history.js"></script></body></html>
