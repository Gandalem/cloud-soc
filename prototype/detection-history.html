<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탐지 실행·제외 이력 | Cloud SOC</title><link rel="icon" href="assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="agents.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="operations.css"><script src="auth-client.js"></script>
  <script src="shell.js" defer></script></head>
<body class="agents-page"><a class="skip-link" href="#main">본문으로 이동</a><div id="app-shell"></div><main id="main" class="main-content agents-main operations-main">
<div class="page-heading"><h1>탐지 실행·제외 이력</h1></div>
<form id="history-filter" class="panel ops-toolbar"><label>기록 종류 <select id="history-kind"><option value="runs">규칙 실행</option><option value="exclusions">제외 이벤트</option></select></label>
<label>규칙 ID <input id="history-rule" maxlength="64" placeholder="전체 규칙"></label><button type="submit" class="primary-button">최근 24시간 조회</button></form>
<p id="history-state" role="status" aria-live="polite">조회 준비 중</p><div id="history-rows"></div><button id="history-next" type="button" hidden>다음 페이지</button>
<details class="usage-details"><summary>이력 기준</summary><p>규칙별 실행 결과와 평가에서 제외한 이벤트를 표시합니다. 이벤트 본문은 제공하지 않습니다. ‘평가 종료’는 처리 위치가 아직 저장되지 않은 상태입니다.</p></details>
</main><script src="detection-history.js"></script></body></html>
