<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>멀티 클라우드 보안 로그 · Cloud SOC</title><link rel="stylesheet" href="/multicloud/multicloud.css"><script defer src="/multicloud/multicloud.js"></script></head>
<body class="cloud-page"><header><a href="/">Cloud SOC</a><span>통합 보안 관제</span><a href="/logs.html">기존 로그 탐색</a></header><main>
<div class="cloud-heading"><div><p class="eyebrow">MULTICLOUD AUDIT OPERATIONS</p><h1>멀티클라우드 보안 로그</h1><p>공급자별 계정 활동과 작업 결과를 한 화면에서 확인합니다.</p></div><span class="cloud-scope">AWS / AZURE / NAVER</span></div>
<section class="filters" aria-label="로그 필터"><label>조회 기간<select id="hours"><option value="1">최근 1시간</option><option value="6">최근 6시간</option><option value="24" selected>최근 24시간</option><option value="168">최근 7일</option></select></label><label>클라우드<select id="provider"><option value="">전체 클라우드</option><option value="aws">AWS</option><option value="azure">Microsoft Azure</option><option value="naver">Naver Cloud</option></select></label><label>작업 결과<select id="outcome"><option value="">모든 결과</option><option value="failure">실패</option><option value="success">성공</option><option value="unknown">확인 불가</option></select></label><button id="refresh" type="button">새로고침</button><span id="updated"></span></section>
<p id="status" role="status" aria-live="polite"></p><section id="cards" class="cards" aria-label="현재 필터의 클라우드별 로그 현황"></section>
<div class="cloud-analysis"><section class="panel cloud-timeline"><div class="panel-heading"><h2>시간별 활동</h2><span>감사 이벤트 · 건</span></div><div id="timeline" class="timeline" aria-label="시간별 이벤트 수"></div></section>
<section class="panel cloud-actions"><div class="panel-heading"><h2>주요 작업</h2><span>현재 필터 기준</span></div><div id="actions" class="actions"></div></section>
</div><section class="panel cloud-events"><div class="panel-heading"><h2>감사 로그 <span id="count"></span></h2><span>최신 이벤트</span></div><p>수집기가 공통 필드로 변환한 감사 로그 · 최신 최대 100건 · 공통 탐지 정규화 완료 여부와는 별개입니다. 시각은 브라우저 현지 시각입니다.</p><div class="scroll"><table><thead><tr><th>발생 시각</th><th>클라우드 / 계정</th><th>조직</th><th>작업 / 서비스</th><th>결과</th><th>행위자</th><th>출발지 IP</th><th>리소스</th></tr></thead><tbody id="events"></tbody></table></div></section></main></body></html>
