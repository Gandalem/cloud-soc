<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 | Cloud SOC</title><link rel="icon" href="/login/mark.svg" type="image/svg+xml"><script src="/theme.js"></script>

<body class="agents-page login-page"><main class="login-card panel"><div class="login-brand"><img src="/login/mark.svg" alt="">Cloud SOC</div><h1>로그인</h1><p id="login-mode" role="status">로그인 방식 확인 중</p><form id="login-form" hidden><label>계정<input name="username" autocomplete="username" maxlength="64" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label><button type="submit" class="primary-button">로그인</button></form><div id="login-basic" hidden><p>이 서버는 브라우저의 인증 창으로 로그인합니다. 포털을 열어 관리자 계정으로 접속하세요.</p><a class="button-link primary-button" href="/">포털 열기</a></div><p id="login-error" class="error-text" role="alert"></p></main></body></html>
