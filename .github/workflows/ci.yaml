name: Cloud-SOC CI & GitOps Sync Pipeline

on:
  push:
    branches: [main, develop, JEONGRIM-SEO]
  pull_request:
    branches: [main, JEONGRIM-SEO]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-soc-core
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-soc-frontend
  GITOPS_REPO: ${{ github.repository_owner }}/cloud-soc-gitops
  PYTHONPATH: src:.

jobs:
  # =====================================================================
  # 1단계: 코드 테스트 및 보안 탐지 룰 무결성/ReDoS 검증
  # =====================================================================
  validate-and-test:
    name: Test Code & Validate Detection Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install --no-build-isolation -e .

      - name: Validate YAML Detection Rules
        run: python -m cloud_soc.detection.rule_loader --validate-dir rules/

      - name: Run Unit & Integration Tests
        env:
          CLOUD_SOC_STATE_BACKEND: "local"
          SOC_TEST_P2_METRICS_DIR: "/tmp/soc-p2-metrics"
        run: pytest tests/ -v --ignore=tests/manual

  # =====================================================================
  # 2단계: 불변(Immutable) 컨테이너 이미지 빌드 및 GHCR 푸시
  # =====================================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/JEONGRIM-SEO')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout App Repository
        uses: actions/checkout@v4

      - name: Extract Short Commit SHA
        id: meta
        run: echo "short_sha=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Core Backend/Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================================
  # 3단계: GitOps 저장소 매니페스트 및 탐지 룰 자동 갱신 (ArgoCD 트리거)
  # =====================================================================
  update-gitops-manifest:
    name: Update GitOps Repository for ArgoCD
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/JEONGRIM-SEO')
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-sync-${{ vars.GITOPS_REPO }}
      cancel-in-progress: false
    steps:
      - name: Checkout App Repository (for latest rules/*.yml)
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          path: gitops-repo

      - name: Update Helm Image Tags & Sync Rules
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          sed -i "s|tag: \".*\" # backend-tag|tag: \"${NEW_TAG}\" # backend-tag|g" gitops-repo/charts/cloud-soc/values.yaml
          sed -i "s|tag: \".*\" # frontend-tag|tag: \"${NEW_TAG}\" # frontend-tag|g" gitops-repo/charts/cloud-soc/values.yaml

          mkdir -p gitops-repo/charts/cloud-soc/files/rules
          cp app-repo/rules/*.yml gitops-repo/charts/cloud-soc/files/rules/

      - name: Commit & Push to GitOps Repository
        working-directory: gitops-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): deploy cloud-soc image ${{ needs.build-and-push.outputs.image_tag }} & sync rules"
            git push
          else
            echo "변경된 매니페스트나 룰이 없습니다."
          fi