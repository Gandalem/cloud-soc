name: Cloud SOC quality
on:
  push:
    branches: [main, JEONGRIM-SEO, 'integration/**', 'codex/dashboard-platform-20261013', 'codex/vm-form-layout-20261014', 'codex/runtime-v2-upgrade-hardening']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-and-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
            deploy/*/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Ruff correctness checks
        run: python -m ruff check src tests tools
      - name: Linux regression with coverage
        if: runner.os == 'Linux'
        run: |
          python -m pytest -q --cov=cloud_soc --cov-report=term-missing --cov-report=xml --cov-report=json --cov-report=html
          python tools/coverage_badge.py
      - name: Windows detection and agent configuration regression
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_portfolio.py tests/test_cloud_detection.py tests/test_sequence_detection.py tests/test_attack_detection.py tests/test_processing.py tests/test_worker_index_batches.py tests/test_detection_resume.py tests/test_incremental_detection.py tests/test_basic_auth_guard.py tests/test_portal_lan_origin.py tests/test_agent_endpoint.py tests/test_agent_policy.py tests/test_linux_operational.py tests/test_cases.py tests/test_case_scope.py tests/test_integration_security.py tests/test_improvements.py tests/test_source_access.py tests/test_capacity_p2.py tests/test_backup_readiness_p2.py tests/test_collector_metrics_p2.py tests/test_early_notices.py tests/test_metadata_patterns.py tests/test_dashboards.py tests/test_dashboard_collection.py tests/test_portal_backup.py tests/test_agent_status.py tests/test_early_status_visibility.py tests/test_reader_maintenance.py tests/test_reprocessing_scope.py tests/test_runtime_audit.py tests/test_web_collection.py tests/test_site_agents.py tests/test_ruleset_complete.py tests/test_ruleset_integration.py
      - name: Windows independent live and backlog regression
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_normalizer_catchup.py tests/test_additional_detection.py tests/test_dual_processing.py tests/test_retrospective_detection.py
      - name: Common runtime parity and upgrade failure regression
        run: python -m pytest -q tests/test_deployment_parity.py tests/test_school_runtime_compat.py tests/test_upgrade_safety.py tests/test_upgrade_lifecycle.py tests/test_slack_notifications.py tests/test_slack_messages.py tests/test_alert_navigation.py tests/test_deployment_permissions.py
      - name: Windows PowerShell parser and offline agent tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem deploy/agents -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $failures += $errors }
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
          node --test --test-concurrency=1 deploy/agents/tests/*.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage.json
            htmlcov/
            docs/portfolio/coverage.svg
          if-no-files-found: error
      - name: Synthetic quality and benchmark artifact
        if: runner.os == 'Linux'
        run: python tools/portfolio_eval.py --events 1000 --output /tmp/portfolio-evaluation.json
      - name: Evaluation artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-${{ github.sha }}
          path: /tmp/portfolio-evaluation.json
          if-no-files-found: error
      - name: Offline rule profiles
        env:
          PYTHONPATH: src
        run: |
          python -m cloud_soc.detection --include-cloud --include-sequence --include-attacks --include-patterns --early-auth
          python -m cloud_soc.detection --isolated-all
      - name: UI regressions and authentication syntax
        run: |
          node --test prototype/tests/*.test.cjs
          node --check prototype/auth-client.js
          node --check prototype/login.js
          node --check prototype/settings-slack.js
          node --test deploy/server/tests/*.test.cjs
      - name: Bandit medium and high severity
        if: runner.os == 'Linux'
        run: python -m bandit -r src -ll -q
      - name: Known dependency vulnerabilities
        if: runner.os == 'Linux'
        run: python -m pip_audit
      - name: Compose config and production image build
        if: runner.os == 'Linux'
        env:
          SOC_STATE_DIR: /tmp/soc-ci-state
          SOC_PUBLIC_HOST: soc.invalid
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.prod.yaml config --quiet
          docker build -f deploy/server/Dockerfile -t cloud-soc:ci .
          mkdir -p /tmp/soc-ci-state/runtime
          printf 'SOC_STATE_DIR=/tmp/soc-ci-state\nSOC_PUBLIC_HOST=soc.invalid\n' > /tmp/soc-ci-state/compose.env
          docker compose --env-file /tmp/soc-ci-state/compose.env -f deploy/server/compose.yaml config --quiet
      - name: Real Linux deployment ownership in isolated root container
        if: runner.os == 'Linux'
        run: |
          docker build -f deploy/server/tests/permissions.Dockerfile -t cloud-soc-permissions:ci .
          docker run --rm --network none --read-only --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges:true --memory 512m --cpus 1 --pids-limit 64 --tmpfs /tmp:rw,nosuid,nodev,size=96m cloud-soc-permissions:ci
      - name: Real Compose lifecycle and legacy recovery on disposable projects
        if: runner.os == 'Linux'
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests" "$(command -v python)" tests/linux_upgrade_lifecycle.py
      - name: Gateway allowlist integration on isolated loopback
        if: runner.os == 'Linux'
        env:
          SOC_TEST_CADDY: /tmp/cloud-soc-test-caddy
        run: |
          docker create --name cloud-soc-test-gateway caddy:2.11.4-alpine
          docker cp cloud-soc-test-gateway:/usr/bin/caddy /tmp/cloud-soc-test-caddy
          docker rm cloud-soc-test-gateway
          chmod u+x /tmp/cloud-soc-test-caddy
          python -m pytest -q tests/test_gateway_allowlist.py
