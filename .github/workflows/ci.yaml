name: Cloud SOC quality
on:
  push:
    branches: [main, JEONGRIM-SEO]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-and-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
            deploy/*/requirements.txt
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Ruff correctness checks
        run: python -m ruff check src tests
      - name: Offline Python regression
        run: python -m pytest -q
      - name: Offline rule profiles
        env:
          PYTHONPATH: src
        run: python -m cloud_soc.detection --include-cloud --include-sequence
      - name: UI regressions and authentication syntax
        run: |
          node --test prototype/tests/*.test.cjs
          node --check prototype/auth-client.js
          node --check prototype/login.js
      - name: Bandit medium and high severity
        run: python -m bandit -r src -ll -q
      - name: Known dependency vulnerabilities
        run: python -m pip_audit
      - name: Compose config and production image build
        env:
          SOC_STATE_DIR: /tmp/soc-ci-state
          SOC_PUBLIC_HOST: soc.invalid
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.prod.yaml config --quiet
          docker build -f deploy/server/Dockerfile -t cloud-soc:ci .
