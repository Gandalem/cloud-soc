{
  "rules": [
    {
      "id": "SCENARIO-SERVER-FILE-001",
      "name": "중요 파일 변경",
      "type": "cardinality",
      "enabled": true,
      "severity": "medium",
      "detection_type": "security_observation",
      "group_by": [
        "organization.id",
        "host.id"
      ],
      "threshold": {
        "count": 3
      },
      "distinct": {
        "field": "host.id",
        "count": 1
      },
      "time_window": {
        "seconds": 900
      },
      "cooldown": {
        "seconds": 900
      },
      "conditions": [
        {
          "field": "cloud_soc.detail.adapter",
          "operator": "equals",
          "value": "security_scenarios_v1"
        },
        {
          "field": "cloud_soc.detail.fields.scenario_kind",
          "operator": "equals",
          "value": "server_file"
        },
        {
          "field": "cloud_soc.detail.fields.critical_asset",
          "operator": "equals",
          "value": true
        }
      ],
      "required_fields": [
        "organization.id",
        "host.id"
      ],
      "dedup_fields": [],
      "limitations": [
        "three_distinct_raw_observations_required",
        "exporter_metadata_requires_configured_source",
        "thresholds_not_operationally_verified",
        "no_attack_success_or_causation_established"
      ],
      "alert": {
        "title": "중요 파일 변경 3건 이상 관측",
        "message": "15분 구간에서 조건에 맞는 고유 관측이 3건 이상 집계되었습니다. 원본 참조와 수행 주체·대상·시각을 조사하세요. 승인된 작업과 오탐 가능성이 있으며 침해 성공을 확정하지 않습니다.",
        "category": "file",
        "tags": [
          "security-scenarios",
          "server_file",
          "minimum-three"
        ]
      }
    },
