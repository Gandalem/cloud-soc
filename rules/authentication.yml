# ============================================================
# Cloud SOC - Authentication Detection Rules
#
# 역할:
# 인증 관련 보안 이벤트의 탐지 조건을 정의한다.
#
# Python Detection Engine은 이 파일을 읽어서
# 조건 / 시간 / 횟수를 계산한다.
# ============================================================


rules:

  # ----------------------------------------------------------
  # AUTH-001
  # SSH Brute Force
  # ----------------------------------------------------------

  - id: "AUTH-001"

    name: "SSH Brute Force"

    description: >
      동일한 Source IP에서 일정 시간 동안
      SSH 인증 실패가 반복적으로 발생할 경우
      무차별 대입 공격 가능성이 있다고 판단한다.

    enabled: true

    severity: "high"


    # --------------------------------------------------------
    # 어떤 이벤트를 탐지 대상으로 볼 것인가?
    # --------------------------------------------------------

    conditions:

      - field: "event.category"
        operator: "contains"
        value: "authentication"

      - field: "event.outcome"
        operator: "equals"
        value: "failure"

      - field: "network.protocol"
        operator: "equals"
        value: "ssh"


    # --------------------------------------------------------
    # 어떤 값을 기준으로 이벤트를 묶을 것인가?
    # --------------------------------------------------------

    group_by:
      - "source.ip"

    # 같은 source.ip에서 발생한 실패를 하나의 그룹으로 계산한다.


    # --------------------------------------------------------
    # 횟수 조건
    # --------------------------------------------------------

    threshold:
      count: 10

      # TEST:
      # 현재 MVP 기준:
      # 동일 IP에서 10회 이상 실패하면 탐지한다.
      #
      # TODO:
      # 실제 정상/공격 데이터를 수집한 후
      # 오탐률을 기준으로 값을 조정한다.


    # --------------------------------------------------------
    # 시간 조건
    # --------------------------------------------------------

    time_window:
      seconds: 300

      # 300초 = 5분
      #
      # TEST:
      # 현재 MVP에서는 5분을 사용한다.
      #
      # TODO:
      # 실제 테스트 결과에 따라
      # 1분 / 3분 / 10분 등으로 조정 가능하다.


    # --------------------------------------------------------
    # 중복 Alert 방지
    # --------------------------------------------------------

    cooldown:
      seconds: 300

      # 같은 IP에서 조건을 계속 만족하더라도
      # 5분 동안 동일 Rule Alert를 반복 생성하지 않는다.
      #
      # TODO:
      # Detection Engine 구현 시 적용한다.


    # --------------------------------------------------------
    # 탐지 결과에 사용할 정보
    # --------------------------------------------------------

    alert:

      title: "SSH Brute Force 탐지"

      message: >
        동일 Source IP에서 5분 이내
        SSH 인증 실패가 10회 이상 발생했습니다.

      category: "authentication"

      tags:
        - "ssh"
        - "brute-force"
        - "authentication"


    # --------------------------------------------------------
    # MITRE ATT&CK
    # --------------------------------------------------------

    mitre:

      tactic:
        - "Credential Access"

      technique:
        - id: "T1110"
          name: "Brute Force"

      # TODO:
      # 추후 세부 공격 형태를 구분하면
      # Password Guessing 등의 Sub-technique도 검토한다.


    # --------------------------------------------------------
    # SECURITY / 운영 관련 메모
    # --------------------------------------------------------

    # SECURITY:
    # 이 Rule은 공격을 "차단"하지 않는다.
    # 현재 Cloud SOC는 탐지 및 Alert 생성이 목적이다.
    #
    # TODO:
    # 향후 SOAR 기능을 추가할 경우
    # 방화벽 차단 등의 자동 대응 정책과 연동할 수 있다.